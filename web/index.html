<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- Primary Meta Tags -->
  <title>CivicFix - Civic Infrastructure Reporting & Severity Triage Platform</title>
  <meta name="title" content="CivicFix - Civic Infrastructure Reporting & Severity Triage Platform">
  <meta name="description" content="CivicFix is a civic infrastructure reporting platform featuring a 5-variable mathematical severity scoring engine, statutory S1-S5 SLAs, 2-hour rapid on-site survey triage, and citizen escalation hearings.">
  <meta name="keywords" content="civic tech, infrastructure reporting, pothole, open manhole, municipal triage, SLA tracking, OpenStreetMap, Flutter Web">
  <meta name="author" content="CivicFix Team">
  <meta name="theme-color" content="#0D47A1">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://saikat-koner.github.io/CivicFix/">
  <meta property="og:title" content="CivicFix - Civic Infrastructure & Severity Scoring Platform">
  <meta property="og:description" content="Empowering citizens and municipal authorities with real-time hazard reporting, 5-variable mathematical triage, and statutory resolution tracking.">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- Twitter Card -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://saikat-koner.github.io/CivicFix/">
  <meta property="twitter:title" content="CivicFix - Civic Infrastructure & Severity Scoring Platform">
  <meta property="twitter:description" content="Empowering citizens and municipal authorities with real-time hazard reporting, 5-variable mathematical triage, and statutory resolution tracking.">
  <meta property="twitter:image" content="icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CivicFix">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0F172A;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #F8FAFC;
    }

    /* CivicFix Splash Screen */
    #civicfix-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #1E293B 0%, #0F172A 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
    }

    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
      max-width: 420px;
    }

    .logo-container {
      position: relative;
      width: 88px;
      height: 88px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #2563EB, #1D4ED8);
      border-radius: 24px;
      box-shadow: 0 12px 30px rgba(37, 99, 235, 0.4);
      animation: pulse-glow 2.5s infinite ease-in-out;
    }

    .logo-icon {
      font-size: 44px;
      line-height: 1;
    }

    @keyframes pulse-glow {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 12px 30px rgba(37, 99, 235, 0.4);
      }
      50% {
        transform: scale(1.06);
        box-shadow: 0 18px 40px rgba(37, 99, 235, 0.6);
      }
    }

    .app-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #FFFFFF;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .app-badge {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(37, 99, 235, 0.2);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #60A5FA;
    }

    .app-subtitle {
      font-size: 13px;
      color: #94A3B8;
      margin-bottom: 32px;
      font-weight: 500;
    }

    .progress-bar-track {
      width: 220px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 16px;
    }

    .progress-bar-indicator {
      position: absolute;
      top: 0;
      left: -50%;
      height: 100%;
      width: 50%;
      background: linear-gradient(90deg, #3B82F6, #60A5FA);
      border-radius: 999px;
      animation: progress-indeterminate 1.6s infinite cubic-bezier(0.65, 0.815, 0.735, 0.395);
    }

    @keyframes progress-indeterminate {
      0% { left: -50%; width: 40%; }
      50% { left: 30%; width: 60%; }
      100% { left: 100%; width: 40%; }
    }

    .loading-status {
      font-size: 12px;
      color: #64748B;
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    .splash-hidden {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }
  </style>
</head>
<body>
  <!-- Branded Splash Screen for seamless Web App startup -->
  <div id="civicfix-splash">
    <div class="splash-content">
      <div class="logo-container">
        <span class="logo-icon">🛡️</span>
      </div>
      <div class="app-title">
        CivicFix <span class="app-badge">v2.0</span>
      </div>
      <div class="app-subtitle">Civic Infrastructure & Severity Triage Platform</div>
      <div class="progress-bar-track">
        <div class="progress-bar-indicator"></div>
      </div>
      <div class="loading-status" id="loading-status-text">Loading CivicFix Engine & OpenStreetMap...</div>
    </div>
  </div>

  <script>
    window.addEventListener('load', function() {
      var statusEl = document.getElementById('loading-status-text');
      if (statusEl) {
        setTimeout(function() {
          statusEl.textContent = 'Initializing Real-time Stream & Supabase...';
        }, 1200);
      }
    });

    // Remove splash screen once Flutter first paints
    window.addEventListener('flutter-first-frame', function() {
      var splash = document.getElementById('civicfix-splash');
      if (splash) {
        splash.classList.add('splash-hidden');
        setTimeout(function() {
          if (splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 600);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
