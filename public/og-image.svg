<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003da1" />
      <stop offset="50%" stop-color="#0050c8" />
      <stop offset="100%" stop-color="#002166" />
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0050c8" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  
  <g transform="translate(100, 140)">
    <!-- Municipal Icon -->
    <rect width="90" height="90" rx="24" fill="#ffffff" />
    <path d="M45 22L20 40H70L45 22Z" fill="#0050c8" />
    <rect x="25" y="44" width="8" height="24" fill="#0050c8" />
    <rect x="37" y="44" width="8" height="24" fill="#0050c8" />
    <rect x="49" y="44" width="8" height="24" fill="#0050c8" />
    <rect x="61" y="44" width="8" height="24" fill="#0050c8" />
    <rect x="18" y="70" width="56" height="6" fill="#0050c8" />

    <text x="110" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">CivicFix</text>
    <text x="310" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#93c5fd" letter-spacing="1">MUNICIPAL OS</text>

    <!-- Subtitle / Headline -->
    <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Community Issue Reporting &amp; GPS Redressal</text>
    
    <text x="0" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#bfdbfe">
      Empowering residents to spot civic defects, track live field crews, and earn civic rewards.
    </text>

    <!-- Badges -->
    <g transform="translate(0, 280)">
      <rect width="170" height="42" rx="21" fill="rgba(255,255,255,0.12)" />
      <text x="85" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">⚡ Real-time GPS</text>

      <rect x="190" width="180" height="42" rx="21" fill="rgba(255,255,255,0.12)" />
      <text x="280" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">🤖 AI Vision Triage</text>

      <rect x="390" width="190" height="42" rx="21" fill="rgba(255,255,255,0.12)" />
      <text x="485" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">🏛️ City Hall Verified</text>
    </g>
