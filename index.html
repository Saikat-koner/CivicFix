<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('civicfix_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
            root.setAttribute('data-theme', 'dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.add('light');
            root.classList.remove('dark');
            root.setAttribute('data-theme', 'light');
            root.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <title>CivicFix - Civic Issue Reporting & Navigation</title>
    <meta name="description" content="Civic issue reporting and tracking platform with open-source maps, AI image analysis, real-time GPS navigation, and community impact leaderboards." />
    <meta property="og:title" content="CivicFix - Civic Issue Reporting & Navigation" />
    <meta property="og:description" content="Civic issue reporting and tracking platform with open-source maps, AI image analysis, real-time GPS navigation, and community impact leaderboards." />
